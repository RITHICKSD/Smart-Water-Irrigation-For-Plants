<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Plant Water Management & Living Environment (React EVS Project)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Premium Glassmorphism styling matching src/index.css */
    :root {
      --bg-dark: #091310;
      --bg-card: rgba(18, 34, 28, 0.75);
      --bg-card-border: rgba(46, 117, 89, 0.3);
      --accent-green: #10b981;
      --accent-green-bright: #34d399;
      --accent-blue: #0ea5e9;
      --accent-amber: #f59e0b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-bright: #ffffff;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem;
    }
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1px solid var(--bg-card-border); color: #fff; }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .grid-layout { display: grid; grid-template-columns: 1fr 360px; gap: 1.5rem; margin-top: 1.5rem; }
    @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; } }
    .sensor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .sensor-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1rem; }
    .sensor-val { font-size: 1.8rem; font-weight: 800; font-family: var(--font-heading); color: #fff; }
    .bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 0.5rem; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent-green-bright); transition: width 0.3s ease; }
    .slider-input { width: 100%; accent-color: var(--accent-green-bright); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PLANTS = [
      { id: 'tomato', name: 'Tomato Plant 🍅', minM: 50, maxM: 75, idealTemp: 24, fact: 'Saves 45% water with smart micro-drip control.' },
      { id: 'peacelily', name: 'Peace Lily 🌿', minM: 60, maxM: 80, idealTemp: 21, fact: 'Filters indoor air while regulating humidity.' },
      { id: 'monstera', name: 'Monstera 🪴', minM: 40, maxM: 65, idealTemp: 23, fact: 'Fenestrated leaves absorb ambient moisture droplets.' },
      { id: 'succulent', name: 'Succulent 🌵', minM: 20, maxM: 40, idealTemp: 28, fact: 'CAM photosynthesis opens stomata at night to cut water loss.' }
    ];

    function ReactApp() {
      const [plant, setPlant] = useState(PLANTS[0]);
      const [soilMoisture, setSoilMoisture] = useState(55);
      const [temperature, setTemperature] = useState(26);
      const [humidity, setHumidity] = useState(62);
      const [light, setLight] = useState(650);
      const [rainDetected, setRainDetected] = useState(false);
      const [waterLevel, setWaterLevel] = useState(85);
      const [isAutoMode, setIsAutoMode] = useState(true);
      const [isPumping, setIsPumping] = useState(false);
      const canvasRef = useRef(null);

      // Live Server Telemetry Sync
      useEffect(() => {
        const syncSensors = async () => {
          try {
            const res = await fetch('/api/sensors');
            if (res.ok) {
              const json = await res.json();
              if (json.data) {
                if (json.data.soilMoisture !== undefined) setSoilMoisture(json.data.soilMoisture);
                if (json.data.temperature !== undefined) setTemperature(json.data.temperature);
                if (json.data.humidity !== undefined) setHumidity(json.data.humidity);
                if (json.data.light !== undefined) setLight(json.data.light);
                if (json.data.rainDetected !== undefined) setRainDetected(json.data.rainDetected);
              }
            }
          } catch (e) {}
        };
        syncSensors();
        const timer = setInterval(syncSensors, 800);
        return () => clearInterval(timer);
      }, []);

      // Automated Pump Logic
      useEffect(() => {
        if (isAutoMode && !isPumping && !rainDetected && soilMoisture < plant.minM && waterLevel > 5) {
          triggerPump();
        }
      }, [soilMoisture, rainDetected, isAutoMode, plant]);

      // Canvas Plant Simulation Render
      useEffect(() => {
        const cvs = canvasRef.current;
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        let frameId;
        let tick = 0;

        const draw = () => {
          tick++;
          ctx.clearRect(0, 0, cvs.width, cvs.height);
          const w = cvs.width;
          const h = cvs.height;

          // Soil pot
          ctx.fillStyle = `rgb(${Math.max(40, 120 - soilMoisture)}, 60, 40)`;
          ctx.beginPath();
          ctx.moveTo(w*0.3, h*0.7);
          ctx.lineTo(w*0.7, h*0.7);
          ctx.lineTo(w*0.65, h);
          ctx.lineTo(w*0.35, h);
          ctx.fill();

          // Plant Stem & Leaves
          const sway = Math.sin(tick * 0.04) * 5;
          ctx.beginPath();
          ctx.moveTo(w*0.5, h*0.7);
          ctx.quadraticCurveTo(w*0.5 + sway, h*0.4, w*0.5 + sway*1.2, h*0.2);
          ctx.strokeStyle = soilMoisture < plant.minM ? '#a3e635' : '#10b981';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.stroke();

          // Leaves
          ctx.fillStyle = '#34d399';
          ctx.beginPath();
          ctx.ellipse(w*0.5 + sway - 25, h*0.45, 30, 12, -0.4, 0, Math.PI*2);
          ctx.ellipse(w*0.5 + sway + 25, h*0.35, 30, 12, 0.4, 0, Math.PI*2);
          ctx.fill();

          // Rain effect
          if (rainDetected) {
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 20; i++) {
              const rx = (tick * 13 + i * 35) % w;
              const ry = (tick * 9 + i * 27) % h;
              ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 2, ry + 12); ctx.stroke();
            }
          }

          // Water Spray
          if (isPumping) {
            ctx.fillStyle = '#38bdf8';
            for (let i = 0; i < 15; i++) {
              const px = w*0.35 + (tick*7 + i*20) % (w*0.3);
              const py = h*0.65 + (tick*5 + i*10) % (h*0.1);
              ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
            }
          }

          frameId = requestAnimationFrame(draw);
        };
        draw();
        return () => cancelAnimationFrame(frameId);
      }, [soilMoisture, rainDetected, isPumping, plant]);

      const triggerPump = () => {
        if (rainDetected || isPumping) return;
        setIsPumping(true);
        const inv = setInterval(() => {
          setSoilMoisture(m => Math.min(100, m + 4));
          setWaterLevel(w => Math.max(0, w - 1.5));
        }, 300);
        setTimeout(() => {
          clearInterval(inv);
          setIsPumping(false);
        }, 2500);
      };

      return (
        <div style={{ maxWidth: 1280, margin: '0 auto' }}>
          {/* Header */}
          <div className="glass-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <h1 style={{ fontFamily: 'var(--font-heading)', color: '#fff', fontSize: '1.4rem' }}>
                🌱 Smart Plant <span style={{ color: 'var(--accent-green-bright)' }}>EcoVerse</span> (React Edition)
              </h1>
              <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Interactive IoT Water Management & Micro-Climate System</p>
            </div>
            <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center' }}>
              <select
                value={plant.id}
                onChange={e => setPlant(PLANTS.find(p => p.id === e.target.value))}
                style={{ background: '#12221c', color: '#fff', border: '1px solid var(--accent-green-bright)', padding: '0.5rem 1rem', borderRadius: '12px', fontWeight: 600, cursor: 'pointer' }}
              >
                {PLANTS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
              <div style={{ background: 'rgba(16,185,129,0.15)', color: '#34d399', border: '1px solid #10b981', padding: '0.4rem 0.85rem', borderRadius: '20px', fontSize: '0.75rem', fontWeight: 700 }}>
                React Live
              </div>
            </div>
          </div>

          {/* Grid Layout */}
          <div className="grid-layout">
            <div>
              {/* Plant Visualizer */}
              <div className="glass-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                  <h3 style={{ fontSize: '1rem', color: '#fff' }}>Interactive Plant Ecosystem</h3>
                  <span style={{ fontSize: '0.78rem', color: soilMoisture < plant.minM ? '#f59e0b' : '#34d399', fontWeight: 600 }}>
                    {soilMoisture < plant.minM ? '⚠️ Low Moisture (Dry)' : '✅ Optimal Hydration'}
                  </span>
                </div>
                <canvas ref={canvasRef} width={600} height={320} style={{ width: '100%', height: 320, background: 'rgba(0,0,0,0.2)', borderRadius: 14 }} />
              </div>

              {/* Sensor Gauges */}
              <div className="sensor-grid">
                <div className="sensor-box">
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Soil Moisture (YL-69)</div>
                  <div className="sensor-val">{soilMoisture}%</div>
                  <div className="bar-bg"><div className="bar-fill" style={{ width: `${soilMoisture}%` }}></div></div>
                </div>
                <div className="sensor-box">
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Temperature (DHT11)</div>
                  <div className="sensor-val" style={{ color: '#f43f5e' }}>{temperature}°C</div>
                  <div className="bar-bg"><div className="bar-fill" style={{ width: `${temperature * 2}%`, background: '#f43f5e' }}></div></div>
                </div>
                <div className="sensor-box">
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Air Humidity</div>
                  <div className="sensor-val" style={{ color: '#06b6d4' }}>{humidity}%</div>
                  <div className="bar-bg"><div className="bar-fill" style={{ width: `${humidity}%`, background: '#06b6d4' }}></div></div>
                </div>
                <div className="sensor-box">
                  <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Rain Sensor (FC-37)</div>
                  <div className="sensor-val" style={{ fontSize: '1.2rem', color: rainDetected ? '#38bdf8' : '#fff' }}>
                    {rainDetected ? 'RAINING 🌧️' : 'CLEAR ☀️'}
                  </div>
                  <div className="bar-bg"><div className="bar-fill" style={{ width: rainDetected ? '100%' : '5%', background: '#38bdf8' }}></div></div>
                </div>
              </div>
            </div>

            {/* Sidebar Controls */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
              <div className="glass-card">
                <h3 style={{ fontSize: '1rem', marginBottom: '1rem' }}>⚡ Smart Pump Controls</h3>
                
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center' }}>
                  <span style={{ fontSize: '0.85rem' }}>Auto Irrigation</span>
                  <input type="checkbox" checked={isAutoMode} onChange={e => setIsAutoMode(e.target.checked)} style={{ width: 20, height: 20, accentColor: '#10b981', cursor: 'pointer' }} />
                </div>

                <button
                  className={`btn ${isPumping ? 'btn-outline' : 'btn-primary'}`}
                  style={{ width: '100%', justifyContent: 'center' }}
                  onClick={triggerPump}
                  disabled={rainDetected}
                >
                  {isPumping ? '🌊 Pumping Water...' : '▶ Manual Water Pump (2.5s)'}
                </button>
                {rainDetected && <p style={{ fontSize: '0.75rem', color: '#38bdf8', marginTop: '0.5rem' }}>Rain detected: Pump locked for water conservation.</p>}
              </div>

            </div>
          </div>
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<ReactApp />);
  </script>
</body>
</html>
